<!doctype html>
<html lang="nl">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Dashboard | Klantenbeheer</title>

    <meta
        name="robots"
        content="noindex, nofollow">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link
        rel="stylesheet"
        href="css/style.css">
</head>

<body class="dashboard-page">

    <div class="container-fluid">

        <div class="row min-vh-100">

            <!-- Sidebar -->
            <aside class="col-md-3 col-lg-2 bg-dark text-white p-3">

                <h2 class="h5 mb-4">
                    Klantenbeheer
                </h2>

                <nav class="nav flex-column gap-2">

                    <a
                        class="nav-link text-white"
                        href="dashboard.html">

                        <i class="bi bi-house me-2"></i>
                        Home
                    </a>

                    <a
                        class="nav-link text-white"
                        href="add-customer.html">

                        <i class="bi bi-person-plus me-2"></i>
                        Add Customer
                    </a>

                    <a
                        class="nav-link text-white"
                        href="#customerSearch">

                        <i class="bi bi-search me-2"></i>
                        Search
                    </a>

                </nav>

            </aside>

            <!-- Hoofdinhoud -->
            <main class="col-md-9 col-lg-10 p-4">

                <header
                    class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">

                    <h1 class="h3 mb-0">
                        Klantenbeheer Dashboard
                    </h1>

                    <div class="d-flex align-items-center gap-3">

                        <span>
                            Welkom, Ahmad
                        </span>

                        <a
                            href="index.html"
                            class="btn btn-outline-danger">

                            <i class="bi bi-box-arrow-right me-1"></i>
                            Uitloggen
                        </a>

                    </div>

                </header>

                <section>

    <div
        class="d-flex justify-content-between align-items-center mb-3">

        <h2 class="h4 mb-0">
            Klantenoverzicht
        </h2>

        <div class="input-group w-auto">

            <span class="input-group-text">
                <i class="bi bi-search"></i>
            </span>

            <input
                type="search"
                class="form-control"
                id="customerSearch"
                placeholder="Zoeken...">

        </div>

    </div>

    <div class="table-responsive">

        <table
            class="table table-bordered table-hover align-middle"
            id="customerTable">

            <thead class="table-light">

                <tr>
                    <th>#</th>
                    <th>Naam</th>
                    <th>Geslacht</th>
                    <th>Land</th>
                    <th>Leeftijd</th>
                    <th>Acties</th>
                </tr>

            </thead>

            <tbody></tbody>

        </table>

    </div>

</section>


<!-- Klantgegevens bekijken -->
<div class="modal fade" id="viewCustomerModal"
     tabindex="-1"
     aria-labelledby="viewCustomerModalLabel"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">
                <h2 class="modal-title fs-5"
                    id="viewCustomerModalLabel">
                    Klantgegevens
                </h2>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Sluiten">
                </button>
            </div>

            <div class="modal-body">

                <dl class="row mb-0">
                    <dt class="col-sm-4">Naam</dt>
                    <dd class="col-sm-8" id="viewName"></dd>

                    <dt class="col-sm-4">Geslacht</dt>
                    <dd class="col-sm-8" id="viewGender"></dd>

                    <dt class="col-sm-4">Land</dt>
                    <dd class="col-sm-8" id="viewCountry"></dd>

                    <dt class="col-sm-4">Leeftijd</dt>
                    <dd class="col-sm-8" id="viewAge"></dd>
                </dl>

            </div>

            <div class="modal-footer">
                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Sluiten
                </button>
            </div>

        </div>
    </div>
</div>

            </main>

        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="js/main.js"></script>

</body>

</html>
