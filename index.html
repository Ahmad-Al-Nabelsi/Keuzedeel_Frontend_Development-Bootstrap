<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Klantenbeheer Dashboard</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link rel="icon" type="image/png" href="images/favicon.png">

    <!-- Eigen CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light login-page">

    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                Klantenbeheer Dashboard
            </a>

            <div class="dropdown">
                <button
                    class="btn btn-outline-secondary dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">
                    Menu
                </button>

                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <span class="dropdown-item-text">
                            Contact
                        </span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row align-items-center justify-content-center g-5">

            <div class="col-lg-6">
                <h1 class="display-5 fw-bold">
                    Welkom bij Klantenbeheer Dashboard
                </h1>

                <p class="lead text-secondary">
                    Een eenvoudige applicatie voor het bekijken,
                    zoeken en beheren van klantgegevens.
                </p>
            </div>

            <div class="col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">

                        <h2 class="h4 mb-4">
                            Inloggen
                        </h2>

                        <div class="mb-3">
                            <label
                                for="email"
                                class="form-label">
                                E-mail
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                placeholder="naam@voorbeeld.nl">
                        </div>

                        <div class="mb-3">
                            <label
                                for="password"
                                class="form-label">
                                Wachtwoord
                            </label>

                            <div class="input-group">
                                <input
                                    type="password"
                                    class="form-control"
                                    id="password">

                                <button
                                    class="btn btn-outline-secondary"
                                    type="button"
                                    id="togglePassword"
                                    aria-label="Wachtwoord tonen">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <button
                                type="button"
                                class="btn btn-link p-0">
                                Wachtwoord vergeten?
                            </button>
                        </div>

                        <a
                            href="dashboard.html"
                            class="btn btn-primary w-100 mb-3">
                            Inloggen
                        </a>

                        <div class="text-center">
                            <span>Nog geen account?</span>

                            <button
                                type="button"
                                class="btn btn-link p-0">
                                Account aanmaken
                            </button>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="js/main.js"></script>

</body>
</html>
